<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Group | Navigate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <header class="header">
            <h1 class="brand-title">Pastel<span class="brand-dot">.</span></h1>
            <p class="brand-subtitle">Choose your workspace</p>
        </header>
        
        <div class="cards-container">
            <!-- Pastel Billing Card -->
            <a href="#" class="card billing-card" id="billing-link">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <h2>Pastel Billing</h2>
                    <p class="description">Smart solutions for restaurant billing & management.</p>
                </div>
                <div class="card-action">
                    <span>Enter Workspace</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>

            <!-- Pastel Frames Card -->
            <a href="#" class="card frames-card" id="frames-link">
                <div class="card-content">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <h2>Pastel Frames</h2>
                    <p class="description">Next-gen automation tools for professional photographers.</p>
                </div>
                <div class="card-action">
                    <span>Enter Workspace</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
            </a>
        </div>

        <footer class="footer">
            <p>&copy; 2026 Pastel Group. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
